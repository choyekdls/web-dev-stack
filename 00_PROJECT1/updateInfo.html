<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="updateInfo.css" />
  </head>
  <body>
    <div class="updateCard">
      <h1>내 정보 수정</h1>

      <form id="updateForm">
        <div class="inputGroup">
          <label for="username">아이디</label>
          <input
            type="text"
            id="username"
            name="username"
            placeholder="아이디"
            readonly
          />
        </div>

        <div class="inputGroup">
          <label for="name">이름</label>
          <input
            type="text"
            id="name"
            name="name"
            placeholder="이름을 입력하세요"
          />
        </div>

        <div class="inputGroup">
          <label for="deptNo">부서</label>
          <select id="deptNo" name="deptNo">
            <option value="" disabled selected>부서를 선택하세요</option>
            <option value="1">마케팅</option>
            <option value="2">인사팀</option>
            <option value="3">회계/재무팀</option>
            <option value="4">물류(재고 관리)팀</option>
            <option value="5">영업팀</option>
          </select>
        </div>

        <div class="inputGroup">
          <label for="memo">메모</label>
          <textarea
            id="memo"
            name="memo"
            placeholder="참고 메모를 입력하세요"
          ></textarea>
        </div>

        <div class="btn-group">
          <button type="button" class="btn btn-outline" id="cancelBtn">
            취소
          </button>
          <button type="submit" class="btn" id="updateBtn">수정 저장</button>
        </div>
      </form>
    </div>
  </body>
</html>
